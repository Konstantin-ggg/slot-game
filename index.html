<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Однорукий бандит</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 16px;
        }

        .slot-machine {
            max-width: 400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 0 2px rgba(255,215,0,0.3) inset;
            border: 1px solid rgba(255,215,0,0.5);
        }

        .balance-panel {
            background: #000000;
            border-radius: 50px;
            padding: 12px 20px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid gold;
            box-shadow: 0 0 10px gold;
        }

        .balance-label {
            font-size: 14px;
            font-weight: bold;
            color: white;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance-value {
            font-size: 26px;
            font-weight: bold;
            color: gold;
            text-shadow: 0 0 10px orange;
            background: rgba(0,0,0,0.5);
            padding: 2px 12px;
            border-radius: 40px;
        }

        .event-banner {
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            border-radius: 16px;
            padding: 8px 12px;
            margin: 12px 0;
            text-align: center;
            border: 2px solid gold;
            box-shadow: 0 0 15px gold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .event-banner:active {
            transform: scale(0.98);
        }

        .event-icon {
            font-size: 24px;
            margin-bottom: 2px;
        }

        .event-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 2px;
            color: #1a1a2e;
        }

        .event-description {
            font-size: 12px;
            margin-bottom: 4px;
            color: #1a1a2e;
        }

        .event-timer {
            font-size: 18px;
            font-weight: bold;
            color: #1a1a2e;
            background: white;
            border-radius: 50px;
            padding: 4px 8px;
            display: inline-block;
            min-width: 160px;
        }

        .ticket-counter {
            margin-top: 6px;
            font-size: 14px;
            font-weight: bold;
            color: #1a1a2e;
            background: rgba(255,255,255,0.5);
            padding: 4px 10px;
            border-radius: 50px;
            display: inline-block;
        }

        .reels-container {
            background: #000;
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 10px 0 #4a4a4a, 0 0 0 4px gold;
        }

        .reels {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .reel {
            flex: 1;
            aspect-ratio: 1/1.2;
            background: white;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            box-shadow: 0 5px 0 #aaa, inset 0 -5px 0 #ddd;
            color: #333;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .reel::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(transparent 30%, rgba(255,215,0,0.2) 50%, transparent 70%);
            pointer-events: none;
        }

        .win-line {
            height: 4px;
            background: gold;
            width: 100%;
            margin: 8px 0;
            border-radius: 2px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .win-line.active {
            opacity: 1;
            box-shadow: 0 0 20px gold;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-spin {
            background: linear-gradient(145deg, #ffd700, #ffb347);
            color: #1a1a2e;
            box-shadow: 0 8px 0 #b8860b;
        }

        .btn-spin:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #b8860b;
        }

        .btn-spin:disabled {
            opacity: 0.5;
            transform: translateY(4px);
            box-shadow: 0 4px 0 #b8860b;
            cursor: not-allowed;
        }

        .btn-maxbet {
            background: linear-gradient(145deg, #4a90e2, #357abd);
            color: white;
            box-shadow: 0 8px 0 #2a4e77;
        }

        .btn-maxbet:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #2a4e77;
        }

        /* НОВЫЙ СТИЛЬ ДЛЯ ТАБЛИЦЫ ЛИДЕРОВ */
        .leaderboard {
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 16px;
            margin: 16px 0;
            border: 1px solid rgba(255,215,0,0.3);
        }

        .leaderboard-title {
            text-align: center;
            margin-bottom: 12px;
            color: gold;
            font-weight: bold;
            font-size: 18px;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            border-radius: 12px;
            margin-bottom: 4px;
            background: rgba(255,255,255,0.05);
        }

        .leaderboard-item.highlight {
            background: rgba(255,215,0,0.2);
            border: 1px solid gold;
        }

        .leaderboard-rank {
            width: 30px;
            color: gold;
        }

        .leaderboard-name {
            flex: 1;
            margin: 0 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .leaderboard-score {
            font-weight: bold;
            color: gold;
        }

        .paytable {
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 16px;
            font-size: 14px;
            border: 1px solid rgba(255,215,0,0.3);
            margin-top: 16px;
        }

        .paytable-title {
            text-align: center;
            margin-bottom: 12px;
            color: gold;
            font-weight: bold;
        }

        .paytable-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            text-align: center;
        }

        .paytable-item {
            background: rgba(255,255,255,0.1);
            padding: 8px;
            border-radius: 12px;
        }

        .win-message {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin: 16px 0;
            min-height: 40px;
            color: gold;
            text-shadow: 0 0 10px rgba(255,215,0,0.5);
        }

        .bet-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin: 16px 0;
        }

        .bet-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: gold;
            color: #1a1a2e;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
        }

        .bet-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .bet-value {
            font-size: 20px;
            font-weight: bold;
            min-width: 60px;
            text-align: center;
            color: gold;
        }
    </style>
</head>
<body>
    <div class="slot-machine">
        <div class="balance-panel">
            <span class="balance-label">💰 БАЛАНС</span>
            <span class="balance-value" id="balance">1000</span>
        </div>

        <div class="event-banner" id="eventBanner">
            <div class="event-icon" id="eventIcon">🏆🚗</div>
            <div class="event-title" id="eventTitle">РОЗЫГРЫШ АВТОМОБИЛЯ</div>
            <div class="event-description" id="eventDescription">
                Каждое вращение = билет. Приз - Toyota Camry!
            </div>
            <div class="event-timer" id="eventTimer">6д 23:59:59</div>
            <div class="ticket-counter" id="ticketCounter">
                🎫 Билеты: 0
            </div>
        </div>

        <div class="reels-container">
            <div class="reels" id="reels">
                <div class="reel" id="reel1">🍒</div>
                <div class="reel" id="reel2">🍒</div>
                <div class="reel" id="reel3">🍒</div>
            </div>
            <div class="win-line" id="winLine"></div>
        </div>

        <div class="win-message" id="winMessage"></div>

        <div class="bet-control">
            <button class="bet-btn" id="decreaseBet">-</button>
            <span class="bet-value" id="betValue">10</span>
            <button class="bet-btn" id="increaseBet">+</button>
        </div>

        <div class="controls">
            <button class="btn btn-spin" id="spinBtn">🎰 КРУТИТЬ</button>
            <button class="btn btn-maxbet" id="maxBetBtn">⚡ MAX СТАВКА</button>
        </div>

        <!-- НОВЫЙ БЛОК: ТАБЛИЦА ЛИДЕРОВ -->
        <div class="leaderboard" id="leaderboard">
            <div class="leaderboard-title">🏆 ТАБЛИЦА ЛИДЕРОВ</div>
            <div id="leaderboardList">
                <!-- Сюда будут подгружаться игроки -->
                <div class="leaderboard-item">
                    <span class="leaderboard-rank">1.</span>
                    <span class="leaderboard-name">Загрузка...</span>
                    <span class="leaderboard-score">0</span>
                </div>
            </div>
        </div>

        <div class="paytable">
            <div class="paytable-title">🎰 ТАБЛИЦА ВЫПЛАТ 🎰</div>
            <div class="paytable-grid">
                <div class="paytable-item">🍒 x2</div>
                <div class="paytable-item">🍋 x3</div>
                <div class="paytable-item">🍊 x3</div>
                <div class="paytable-item">🍇 x4</div>
                <div class="paytable-item">💎 x5</div>
                <div class="paytable-item">7️⃣ x8</div>
            </div>
            <div style="text-align: center; margin-top: 8px; font-size: 12px; opacity: 0.7;">
                2 одинаковых = возврат ставки
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Данные игрока
        const userId = tg.initDataUnsafe?.user?.id || 'anonymous';
        const userName = tg.initDataUnsafe?.user?.first_name || 'Игрок';
        
        // Текущий ивент
        const currentEvent = {
            active: true,
            title: "РОЗЫГРЫШ АВТОМОБИЛЯ",
            description: "Каждое вращение = билет. Приз - Toyota Camry!",
            prize: "Toyota Camry 2026",
            icon: "🏆🚗",
            endDate: "2026-03-25T20:00:00",
            background: "linear-gradient(45deg, #ff6b6b, #feca57)"
        };

        // Элементы интерфейса
        const eventBanner = document.getElementById('eventBanner');
        const eventIcon = document.getElementById('eventIcon');
        const eventTitle = document.getElementById('eventTitle');
        const eventDescription = document.getElementById('eventDescription');
        const eventTimer = document.getElementById('eventTimer');
        const ticketCounter = document.getElementById('ticketCounter');
        const leaderboardList = document.getElementById('leaderboardList');

        // Настройки ивента
        eventIcon.textContent = currentEvent.icon;
        eventTitle.textContent = currentEvent.title;
        eventDescription.textContent = currentEvent.description;
        eventBanner.style.background = currentEvent.background;

        // Игровые переменные
        const SYMBOLS = ['🍒', '🍋', '🍊', '🍇', '💎', '7️⃣'];
        const MULTIPLIERS = {
            '🍒': 2,
            '🍋': 3,
            '🍊': 3,
            '🍇': 4,
            '💎': 5,
            '7️⃣': 8
        };

        let balance = 1000;
        let currentBet = 10;
        let isSpinning = false;
        let tickets = parseInt(localStorage.getItem('tickets') || '0');
        
        // Хранилище лидеров
        let leaderboard = [];

        // Элементы управления
        const balanceEl = document.getElementById('balance');
        const reel1 = document.getElementById('reel1');
        const reel2 = document.getElementById('reel2');
        const reel3 = document.getElementById('reel3');
        const spinBtn = document.getElementById('spinBtn');
        const maxBetBtn = document.getElementById('maxBetBtn');
        const winMessage = document.getElementById('winMessage');
        const winLine = document.getElementById('winLine');
        const betValue = document.getElementById('betValue');
        const decreaseBet = document.getElementById('decreaseBet');
        const increaseBet = document.getElementById('increaseBet');

        // Загрузка лидеров из облака
        function loadLeaderboard() {
            if (tg.CloudStorage) {
                tg.CloudStorage.getItem('leaderboard', (err, data) => {
                    if (data) {
                        try {
                            leaderboard = JSON.parse(data);
                        } catch (e) {
                            leaderboard = [];
                        }
                    }
                    renderLeaderboard();
                });
            } else {
                // Демо-данные для теста
                leaderboard = [
                    { name: 'Игрок123', tickets: 1540, id: '123' },
                    { name: 'Lucky777', tickets: 1320, id: '456' },
                    { name: 'SlotMaster', tickets: 980, id: '789' },
                    { name: userName, tickets: tickets, id: userId },
                    { name: 'Player99', tickets: 98, id: '999' }
                ];
                renderLeaderboard();
            }
        }

        // Сохранение лидеров в облако
        function saveLeaderboard() {
            if (tg.CloudStorage) {
                tg.CloudStorage.setItem('leaderboard', JSON.stringify(leaderboard));
            }
        }

        // Обновление позиции игрока в лидерах
        function updateLeaderboard() {
            // Ищем игрока в таблице
            const existingIndex = leaderboard.findIndex(item => item.id === userId);
            
            if (existingIndex >= 0) {
                // Обновляем существующего
                leaderboard[existingIndex].tickets = tickets;
            } else {
                // Добавляем нового
                leaderboard.push({
                    name: userName,
                    tickets: tickets,
                    id: userId
                });
            }
            
            // Сортируем по убыванию билетов
            leaderboard.sort((a, b) => b.tickets - a.tickets);
            
            // Оставляем только топ-10
            leaderboard = leaderboard.slice(0, 10);
            
            saveLeaderboard();
            renderLeaderboard();
        }

        // Отрисовка таблицы лидеров
        function renderLeaderboard() {
            let html = '';
            
            leaderboard.forEach((player, index) => {
                const isCurrentPlayer = player.id === userId;
                const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}.`;
                
                html += `
                    <div class="leaderboard-item ${isCurrentPlayer ? 'highlight' : ''}">
                        <span class="leaderboard-rank">${medal}</span>
                        <span class="leaderboard-name">${player.name}</span>
                        <span class="leaderboard-score">${player.tickets}</span>
                    </div>
                `;
            });
            
            leaderboardList.innerHTML = html;
        }

        // Таймер ивента
        function updateEventTimer() {
            const end = new Date(currentEvent.endDate).getTime();
            const now = new Date().getTime();
            const distance = end - now;
            
            if (distance < 0) {
                eventTimer.textContent = "ИВЕНТ ЗАВЕРШЕН!";
                eventTimer.style.background = "#ff6b6b";
                eventTimer.style.color = "white";
                return;
            }
            
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            
            eventTimer.textContent = `${days}д ${hours}ч ${minutes}м ${seconds}с`;
        }

        updateEventTimer();
        setInterval(updateEventTimer, 1000);

        // Клик по баннеру
        eventBanner.addEventListener('click', function() {
            tg.showPopup({
                title: currentEvent.title,
                message: `🏆 ПРИЗ: ${currentEvent.prize}\n\n${currentEvent.description}\n\n🎫 Ваши билеты: ${tickets}\n\n🏅 ТОП-3 ИГРОКОВ:\n1. ${leaderboard[0]?.name || '???'} - ${leaderboard[0]?.tickets || 0} билетов\n2. ${leaderboard[1]?.name || '???'} - ${leaderboard[1]?.tickets || 0} билетов\n3. ${leaderboard[2]?.name || '???'} - ${leaderboard[2]?.tickets || 0} билетов`,
                buttons: [{type: 'close', text: '🎰 Крутить дальше!'}]
            });
        });

        // Функции игры
        function updateUI() {
            balanceEl.textContent = balance;
            betValue.textContent = currentBet;
            ticketCounter.textContent = `🎫 Билеты: ${tickets}`;
            localStorage.setItem('tickets', tickets);
            updateLeaderboard();
        }

        function getRandomSymbol() {
            return SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
        }

        function calculateWin(s1, s2, s3, bet) {
            if (s1 === s2 && s2 === s3) {
                return bet * MULTIPLIERS[s1];
            }
            if (s1 === s2 || s1 === s3 || s2 === s3) {
                return bet;
            }
            return 0;
        }

        function addTicket() {
            tickets++;
            updateUI();
        }

        async function spin() {
            if (isSpinning) return;
            if (balance < currentBet) {
                winMessage.textContent = '❌ Недостаточно средств!';
                return;
            }

            isSpinning = true;
            spinBtn.disabled = true;
            maxBetBtn.disabled = true;
            decreaseBet.disabled = true;
            increaseBet.disabled = true;
            
            balance -= currentBet;
            updateUI();
            
            winMessage.textContent = '';
            winLine.classList.remove('active');

            const spinDuration = 500;
            const startTime = Date.now();
            
            while (Date.now() - startTime < spinDuration) {
                reel1.textContent = getRandomSymbol();
                reel2.textContent = getRandomSymbol();
                reel3.textContent = getRandomSymbol();
                await new Promise(r => setTimeout(r, 50));
            }

            const result = [getRandomSymbol(), getRandomSymbol(), getRandomSymbol()];
            reel1.textContent = result[0];
            reel2.textContent = result[1];
            reel3.textContent = result[2];

            const win = calculateWin(result[0], result[1], result[2], currentBet);
            
            if (win > 0) {
                balance += win;
                winMessage.textContent = `🎉 ВЫИГРЫШ: ${win} 🎉`;
                winLine.classList.add('active');
                addTicket();
            } else {
                winMessage.textContent = '😢 Попробуй еще!';
            }

            addTicket();
            updateUI();

            isSpinning = false;
            spinBtn.disabled = false;
            maxBetBtn.disabled = false;
            decreaseBet.disabled = false;
            increaseBet.disabled = false;
        }

        // Обработчики
        spinBtn.addEventListener('click', spin);

        maxBetBtn.addEventListener('click', () => {
            currentBet = Math.min(100, balance);
            updateUI();
        });

        decreaseBet.addEventListener('click', () => {
            if (currentBet > 10 && !isSpinning) {
                currentBet -= 10;
                updateUI();
            }
        });

        increaseBet.addEventListener('click', () => {
            if (currentBet < 100 && currentBet + 10 <= balance && !isSpinning) {
                currentBet += 10;
                updateUI();
            }
        });

        // Загрузка данных
        loadLeaderboard();
        updateUI();
    </script>
</body>
</html>
