<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Джекпот Слот</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        /* 1. ИСПРАВЛЕННЫЙ ФУНДАМЕНТ (Чтобы не было карусели) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: white;
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* Важно: убираем скролл у body */
        }

        /* Контейнер для страниц */
        .pages-container {
            width: 100%;
            height: calc(100% - 70px); /* Оставляем место под точки внизу */
            overflow-x: auto;
            overflow-y: hidden;
            display: flex;
            scroll-snap-type: x mandatory; /* Прилипание страниц */
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .pages-wrapper {
            display: flex;
            height: 100%;
            width: auto;
        }

        .page {
            width: 100vw;
            height: 100%;
            flex-shrink: 0;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            overflow-y: auto; /* Скролл только внутри страницы, если контента много */
            padding: 16px;
        }

        /* 2. ТВОИ ОРИГИНАЛЬНЫЕ СТИЛИ (Дизайн слота и панелей) */
        .slot-machine {
            max-width: 400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 0 2px rgba(255,215,0,0.3) inset;
            border: 1px solid rgba(255,215,0,0.5);
            margin: 0 auto 20px auto;
        }

        .reels-container { background: #000; border-radius: 24px; padding: 24px; margin: 12px 0; box-shadow: 0 10px 0 #4a4a4a, 0 0 0 4px gold; }
        .reels { display: flex; gap: 12px; justify-content: center; }
        .reel { flex: 1; aspect-ratio: 1/1.2; background: white; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 54px; color: #333; }
        
        .balance-panel { background: #000; border-radius: 50px; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border: 2px solid gold; }
        .balance-value { font-size: 24px; font-weight: bold; color: gold; }

        .btn { flex: 1; padding: 16px; border: none; border-radius: 50px; font-size: 18px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-spin { background: linear-gradient(145deg, #ffd700, #ffb347); color: #1a1a2e; box-shadow: 0 6px 0 #b8860b; }
        .btn-spin:active { transform: translateY(4px); box-shadow: none; }

        /* Админка и таблицы (Твои стили) */
        .admin-panel { background: linear-gradient(145deg, #2a1a3a, #1a0a2a); border-radius: 20px; padding: 16px; border: 2px solid #ff4444; margin-bottom: 20px; }
        .leaderboard-item { display: flex; justify-content: space-between; padding: 8px 12px; border-radius: 12px; margin-bottom: 4px; background: rgba(255,255,255,0.05); }

        /* 3. ИСПРАВЛЕННЫЕ ТОЧКИ НАВИГАЦИИ */
        .dots {
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.2);
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transition: all 0.3s ease;
        }

        .dot.active {
            background: gold;
            width: 25px;
            border-radius: 5px;
            box-shadow: 0 0 10px gold;
        }
        
        .win-line { height: 4px; background: gold; width: 100%; margin-top: 8px; opacity: 0; transition: 0.3s; }
        .win-line.active { opacity: 1; box-shadow: 0 0 15px gold; }
    </style>
</head>
<body>

    <div class="pages-container" id="pagesContainer">
        <div class="pages-wrapper">
            
            <div class="page">
                <div style="background: rgba(0,0,0,0.3); padding: 20px; border-radius: 20px;">
                    <h2 style="color: gold; text-align: center;">📜 ПРАВИЛА</h2>
                    <p style="margin-top: 15px; font-size: 14px;">🎰 Слот: 3 барабана, 7 символов. Выигрыши:</p>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; font-size: 13px;">
                        <div>🍒🍒🍒 → x2</div><div>🍋🍋🍋 → x3</div>
                        <div>💎💎💎 → x5</div><div>7️⃣7️⃣7️⃣ → x8</div>
                    </div>
                </div>
            </div>

            <div class="page">
                <div id="adminPanel" style="display: none;">
                    <div class="admin-panel">
                        <div style="color: #ff4444; font-weight: bold; text-align: center;">🔐 АДМИН-ПАНЕЛЬ</div>
                        <button class="btn" style="background: #444; font-size: 12px; margin-top: 10px;" onclick="window.pickWinner()">ВЫБРАТЬ ПОБЕДИТЕЛЯ</button>
                    </div>
                </div>

                <div class="slot-machine">
                    <div class="balance-panel">
                        <span style="font-size: 14px;">💰 БАЛАНС</span>
                        <span class="balance-value" id="balance">1000</span>
                    </div>

                    <div class="reels-container">
                        <div class="reels">
                            <div class="reel" id="reel1">🍒</div>
                            <div class="reel" id="reel2">🍋</div>
                            <div class="reel" id="reel3">7️⃣</div>
                        </div>
                        <div class="win-line" id="winLine"></div>
                    </div>

                    <div id="winMessage" style="text-align: center; color: gold; font-weight: bold; height: 30px; margin-bottom: 10px;"></div>

                    <div style="display: flex; gap: 10px;">
                        <button class="btn btn-spin" id="spinBtn">🎰 КРУТИТЬ</button>
                    </div>
                </div>
            </div>

            <div class="page">
                <h2 style="color: gold; text-align: center;">⭐ МАГАЗИН</h2>
                <div style="margin-top: 20px; display: grid; gap: 10px;">
                    <div class="leaderboard-item" onclick="buyPackage(10, 1000)">
                        <span>1000 МОНЕТ</span><span style="color: gold;">10 Stars</span>
                    </div>
                    <div class="leaderboard-item" onclick="buyVipTickets(30, 3)">
                        <span>3 VIP БИЛЕТА</span><span style="color: gold;">30 Stars</span>
                    </div>
                </div>
            </div>

            <div class="page">
                <h2 style="color: gold; text-align: center; margin-bottom: 15px;">🏆 ЛИДЕРЫ</h2>
                <div id="leaderboardList">Загрузка...</div>
            </div>

        </div>
    </div>

    <div class="dots" id="dots"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // 1. ЛОГИКА НАВИГАЦИИ (Твой запрос на исправление)
        const pagesContainer = document.getElementById('pagesContainer');
        const dotsContainer = document.getElementById('dots');
        const totalPages = 4;
        let currentPage = 1; // Главная страница — вторая

        function initDots() {
            dotsContainer.innerHTML = '';
            for (let i = 0; i < totalPages; i++) {
                const dot = document.createElement('div');
                dot.className = `dot ${i === currentPage ? 'active' : ''}`;
                dotsContainer.appendChild(dot);
            }
        }

        pagesContainer.addEventListener('scroll', () => {
            const width = pagesContainer.offsetWidth;
            const newIndex = Math.round(pagesContainer.scrollLeft / width);
            if (newIndex !== currentPage) {
                currentPage = newIndex;
                updateActiveDot(currentPage);
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            }
        });

        function updateActiveDot(index) {
            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, i) => dot.classList.toggle('active', i === index));
        }

        // 2. ТВОЯ ОРИГИНАЛЬНАЯ ЛОГИКА (Слот, Adsgram, Сервер)
        let balance = 1000;
        const SYMBOLS = ['🍒', '🍋', '🍊', '🍇', '💎', '7️⃣', '🎫'];

        async function spin() {
            const spinBtn = document.getElementById('spinBtn');
            if (balance < 10) return;

            balance -= 10;
            document.getElementById('balance').textContent = balance;
            spinBtn.disabled = true;
            document.getElementById('winLine').classList.remove('active');
            document.getElementById('winMessage').textContent = '';

            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            // Анимация (Твоя идея)
            let counter = 0;
            const interval = setInterval(() => {
                document.getElementById('reel1').textContent = SYMBOLS[Math.floor(Math.random() * 6)];
                document.getElementById('reel2').textContent = SYMBOLS[Math.floor(Math.random() * 6)];
                document.getElementById('reel3').textContent = SYMBOLS[Math.floor(Math.random() * 6)];
                counter++;
                if (counter > 15) {
                    clearInterval(interval);
                    finalizeSpin();
                }
            }, 70);
        }

        function finalizeSpin() {
            const r1 = SYMBOLS[Math.floor(Math.random() * 6)];
            const r2 = SYMBOLS[Math.floor(Math.random() * 6)];
            const r3 = SYMBOLS[Math.floor(Math.random() * 6)];

            document.getElementById('reel1').textContent = r1;
            document.getElementById('reel2').textContent = r2;
            document.getElementById('reel3').textContent = r3;

            if (r1 === r2 && r2 === r3) {
                document.getElementById('winLine').classList.add('active');
                document.getElementById('winMessage').textContent = 'ВЫИГРЫШ!';
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            }
            
            document.getElementById('spinBtn').disabled = false;
        }

        // Заглушки для твоих функций
        window.buyPackage = (stars, coins) => tg.showAlert(`Покупка ${coins} монет за ${stars} Stars`);
        window.pickWinner = () => tg.showAlert("Выбор победителя...");

        // Инициализация
        window.onload = () => {
            initDots();
            // Сразу на главную (индекс 1)
            setTimeout(() => {
                pagesContainer.scrollTo({ left: pagesContainer.offsetWidth, behavior: 'auto' });
            }, 100);
        };

        document.getElementById('spinBtn').onclick = spin;
    </script>
</body>
</html>
