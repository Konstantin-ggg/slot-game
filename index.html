<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CyberHack Slot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --neon: #00ffff; --pink: #ff00ff; }
        body { background: #050505; color: var(--neon); font-family: 'Courier New', monospace; margin: 0; display: flex; flex-direction: column; align-items: center; }
        
        .header { width: 100%; padding: 10px; display: flex; justify-content: space-around; background: #0a0a0a; border-bottom: 1px solid var(--neon); position: sticky; top: 0; }
        .stat-box { text-align: center; }
        .stat-label { font-size: 10px; color: #666; }
        .stat-value { font-size: 18px; font-weight: bold; }

        .slot-container { margin-top: 50px; display: flex; gap: 10px; padding: 20px; background: #111; border: 2px solid var(--pink); box-shadow: 0 0 20px rgba(255, 0, 255, 0.3); border-radius: 10px; }
        .reel { width: 80px; height: 100px; background: #000; border: 1px solid #333; display: flex; align-items: center; justify-content: center; font-size: 50px; overflow: hidden; position: relative; }
        
        .spinning { animation: blur 0.1s infinite linear; }
        @keyframes blur { 0% { filter: blur(0); transform: translateY(-10px); } 50% { filter: blur(5px); } 100% { filter: blur(0); transform: translateY(10px); } }

        .controls { width: 90%; margin-top: 40px; }
        .btn-spin { width: 100%; padding: 20px; background: transparent; border: 2px solid var(--neon); color: var(--neon); font-size: 20px; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: 0.3s; }
        .btn-spin:active { background: var(--neon); color: #000; }
        .btn-spin:disabled { opacity: 0.3; border-color: #444; }

        #log { margin-top: 20px; font-size: 12px; color: var(--pink); height: 40px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="stat-box">
            <div class="stat-label">CREDITS</div>
            <div class="stat-value" id="balance">1000</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">ENERGY</div>
            <div class="stat-value" id="energy">30</div>
        </div>
    </div>

    <div class="slot-container">
        <div id="r1" class="reel">💾</div>
        <div id="r2" class="reel">💾</div>
        <div id="r3" class="reel">💾</div>
    </div>

    <div id="log">READY TO BYPASS SYSTEM...</div>

    <div class="controls">
        <button id="spinBtn" class="btn-spin" onclick="runHack()">INJECT CODE (SPIN)</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const user = tg.initDataUnsafe.user || { id: 0 }; // Для теста через браузер

        async function runHack() {
            const btn = document.getElementById('spinBtn');
            const reels = [document.getElementById('r1'), document.getElementById('r2'), document.getElementById('r3')];
            const log = document.getElementById('log');

            // 1. Начинаем анимацию
            btn.disabled = true;
            log.innerText = "EXECUTING EXPLOIT...";
            reels.forEach(r => r.classList.add('spinning'));

            try {
                // 2. Запрос к твоему Бэкенду
                const response = await fetch('/api/spin', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: user.id })
                });
                const data = await response.json();

                // Имитируем задержку для красоты (1.5 сек)
                setTimeout(() => {
                    reels.forEach(r => r.classList.remove('spinning'));
                    
                    if (data.error) {
                        log.innerText = "ERROR: " + data.error;
                    } else {
                        // 3. Выводим результат
                        reels[0].innerText = data.result[0];
                        reels[1].innerText = data.result[1];
                        reels[2].innerText = data.result[2];

                        document.getElementById('balance').innerText = data.new_balance;
                        document.getElementById('energy').innerText = data.new_energy;

                        if (data.win > 0) {
                            log.innerText = `SUCCESS! SYSTEM BYPASSED: +${data.win} BTC`;
                            tg.HapticFeedback.notificationOccurred('success');
                        } else {
                            log.innerText = "EXPLOIT FAILED. ACCESS DENIED.";
                            tg.HapticFeedback.impactOccurred('light');
                        }
                    }
                    btn.disabled = false;
                }, 1500);

            } catch (err) {
                alert("NETWORK TIMEOUT");
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
