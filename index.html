<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Однорукий бандит</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 16px;
        }

        .slot-machine {
            max-width: 400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 0 2px rgba(255,215,0,0.3) inset;
            border: 1px solid rgba(255,215,0,0.5);
        }

        .balance-panel {
            background: rgba(0,0,0,0.4);
            border-radius: 50px;
            padding: 16px 24px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid gold;
        }

        .balance-label {
            font-size: 14px;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance-value {
            font-size: 28px;
            font-weight: bold;
            color: gold;
            text-shadow: 0 0 10px rgba(255,215,0,0.5);
        }

        .reels-container {
            background: #000;
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 10px 0 #4a4a4a, 0 0 0 4px gold;
        }

        .reels {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .reel {
            flex: 1;
            aspect-ratio: 1/1.2;
            background: white;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            box-shadow: 0 5px 0 #aaa, inset 0 -5px 0 #ddd;
            color: #333;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .reel.spinning {
            animation: spin 0.2s linear infinite;
        }

        @keyframes spin {
            0% { transform: translateY(0); }
            100% { transform: translateY(100%); }
        }

        .reel::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(transparent 30%, rgba(255,215,0,0.2) 50%, transparent 70%);
            pointer-events: none;
        }

        .win-line {
            height: 4px;
            background: gold;
            width: 100%;
            margin: 8px 0;
            border-radius: 2px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .win-line.active {
            opacity: 1;
            box-shadow: 0 0 20px gold;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-spin {
            background: linear-gradient(145deg, #ffd700, #ffb347);
            color: #1a1a2e;
            box-shadow: 0 8px 0 #b8860b;
        }

        .btn-spin:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #b8860b;
        }

        .btn-spin:disabled {
            opacity: 0.5;
            transform: translateY(4px);
            box-shadow: 0 4px 0 #b8860b;
            cursor: not-allowed;
        }

        .btn-maxbet {
            background: linear-gradient(145deg, #4a90e2, #357abd);
            color: white;
            box-shadow: 0 8px 0 #2a4e77;
        }

        .btn-maxbet:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #2a4e77;
        }

        .paytable {
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 16px;
            font-size: 14px;
            border: 1px solid rgba(255,215,0,0.3);
        }

        .paytable-title {
            text-align: center;
            margin-bottom: 12px;
            color: gold;
            font-weight: bold;
        }

        .paytable-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            text-align: center;
        }

        .paytable-item {
            background: rgba(255,255,255,0.1);
            padding: 8px;
            border-radius: 12px;
        }

        .win-message {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin: 16px 0;
            min-height: 40px;
            color: gold;
            text-shadow: 0 0 10px rgba(255,215,0,0.5);
        }

        .bet-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin: 16px 0;
        }

        .bet-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: gold;
            color: #1a1a2e;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
        }

        .bet-value {
            font-size: 20px;
            font-weight: bold;
            min-width: 60px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="slot-machine">
        <div class="balance-panel">
            <span class="balance-label">Баланс</span>
            <span class="balance-value" id="balance">1000</span>
        </div>

        <div class="reels-container">
            <div class="reels" id="reels">
                <div class="reel" id="reel1">🍒</div>
                <div class="reel" id="reel2">🍒</div>
                <div class="reel" id="reel3">🍒</div>
            </div>
            <div class="win-line" id="winLine"></div>
        </div>

        <div class="win-message" id="winMessage"></div>

        <div class="bet-control">
            <button class="bet-btn" id="decreaseBet">-</button>
            <span class="bet-value" id="betValue">10</span>
            <button class="bet-btn" id="increaseBet">+</button>
        </div>

        <div class="controls">
            <button class="btn btn-spin" id="spinBtn">Крутить</button>
            <button class="btn btn-maxbet" id="maxBetBtn">Max Bet</button>
        </div>

        <div class="paytable">
            <div class="paytable-title">ТАБЛИЦА ВЫПЛАТ</div>
            <div class="paytable-grid">
                <div class="paytable-item">🍒 x2</div>
                <div class="paytable-item">🍋 x3</div>
                <div class="paytable-item">🍊 x4</div>
                <div class="paytable-item">🍇 x5</div>
                <div class="paytable-item">💎 x10</div>
                <div class="paytable-item">7️⃣ x20</div>
            </div>
            <div style="text-align: center; margin-top: 8px; font-size: 12px; opacity: 0.7;">
                2 одинаковых = возврат ставки
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const SYMBOLS = ['🍒', '🍋', '🍊', '🍇', '💎', '7️⃣'];
        const MULTIPLIERS = {
            '🍒': 2,
            '🍋': 3,
            '🍊': 4,
            '🍇': 5,
            '💎': 10,
            '7️⃣': 20
        };

        let balance = 1000;
        let currentBet = 10;
        let isSpinning = false;

        const balanceEl = document.getElementById('balance');
        const reel1 = document.getElementById('reel1');
        const reel2 = document.getElementById('reel2');
        const reel3 = document.getElementById('reel3');
        const spinBtn = document.getElementById('spinBtn');
        const maxBetBtn = document.getElementById('maxBetBtn');
        const winMessage = document.getElementById('winMessage');
        const winLine = document.getElementById('winLine');
        const betValue = document.getElementById('betValue');
        const decreaseBet = document.getElementById('decreaseBet');
        const increaseBet = document.getElementById('increaseBet');

        function updateUI() {
            balanceEl.textContent = balance;
            betValue.textContent = currentBet;
        }

        function getRandomSymbol() {
            return SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
        }

        function calculateWin(s1, s2, s3, bet) {
            if (s1 === s2 && s2 === s3) {
                return bet * MULTIPLIERS[s1];
            }
            if (s1 === s2 || s1 === s3 || s2 === s3) {
                return bet;
            }
            return 0;
        }

        async function spin() {
            if (isSpinning) return;
            if (balance < currentBet) {
                winMessage.textContent = 'Недостаточно средств!';
                return;
            }

            isSpinning = true;
            spinBtn.disabled = true;
            maxBetBtn.disabled = true;
            decreaseBet.disabled = true;
            increaseBet.disabled = true;
            
            balance -= currentBet;
            updateUI();
            
            winMessage.textContent = '';
            winLine.classList.remove('active');

            reel1.classList.add('spinning');
            reel2.classList.add('spinning');
            reel3.classList.add('spinning');

            const spinDuration = 1000;
            const startTime = Date.now();
            
            while (Date.now() - startTime < spinDuration) {
                reel1.textContent = getRandomSymbol();
                reel2.textContent = getRandomSymbol();
                reel3.textContent = getRandomSymbol();
                await new Promise(r => setTimeout(r, 50));
            }

            const result = [getRandomSymbol(), getRandomSymbol(), getRandomSymbol()];
            reel1.textContent = result[0];
            reel2.textContent = result[1];
            reel3.textContent = result[2];

            reel1.classList.remove('spinning');
            reel2.classList.remove('spinning');
            reel3.classList.remove('spinning');

            const win = calculateWin(result[0], result[1], result[2], currentBet);
            
            if (win > 0) {
                balance += win;
                winMessage.textContent = `ВЫИГРЫШ: ${win}`;
                winLine.classList.add('active');
            } else {
                winMessage.textContent = 'Попробуй еще!';
            }

            updateUI();

            isSpinning = false;
            spinBtn.disabled = false;
            maxBetBtn.disabled = false;
            decreaseBet.disabled = false;
            increaseBet.disabled = false;
        }

        spinBtn.addEventListener('click', spin);

        maxBetBtn.addEventListener('click', () => {
            currentBet = Math.min(100, balance);
            updateUI();
        });

        decreaseBet.addEventListener('click', () => {
            if (currentBet > 10 && !isSpinning) {
                currentBet -= 10;
                updateUI();
            }
        });

        increaseBet.addEventListener('click', () => {
            if (currentBet < 100 && currentBet + 10 <= balance && !isSpinning) {
                currentBet += 10;
                updateUI();
            }
        });

        updateUI();
    </script>
</body>
</html>
