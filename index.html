<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Джекпот Слот</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: white;
            height: 100vh;
            width: 100vw;
            overflow: hidden; 
        }

        .pages-wrapper {
            display: flex;
            width: 100%;
            height: calc(100% - 60px);
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .pages-wrapper::-webkit-scrollbar { display: none; }

        .page {
            min-width: 100%;
            height: 100%;
            scroll-snap-align: start;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dots-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 100;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.3s;
        }

        .dot.active {
            background: #4cc9f0;
            transform: scale(1.2);
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 20px;
        }

        .balance-item { display: flex; flex-direction: column; align-items: center; }
        .balance-label { font-size: 12px; opacity: 0.7; }
        .balance-value { font-size: 18px; font-weight: bold; color: #4cc9f0; }

        .slot-machine {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 24px;
            width: 100%;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .reels {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .reel {
            width: 80px;
            height: 100px;
            background: #1a1a2e;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            border: 2px solid #4cc9f0;
        }

        .controls { display: flex; flex-direction: column; gap: 15px; width: 100%; }
        .bet-control { display: flex; justify-content: center; align-items: center; gap: 20px; }
        .bet-btn { background: none; border: 2px solid #4cc9f0; color: white; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; }
        
        .spin-btn {
            background: #4cc9f0;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(76, 201, 240, 0.4);
        }

        .spin-btn:disabled { opacity: 0.5; }

        .card {
            background: rgba(255, 255, 255, 0.05);
            width: 100%;
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 15px;
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 12px;
            border: none;
            background: #4cc9f0;
            color: white;
            font-weight: bold;
        }

        .leader-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="pages-wrapper" id="pagesWrapper">
        
        <div class="page" id="shopPage">
            <h2 style="margin-bottom: 20px;">Магазин Stars ⭐️</h2>
            
            <div class="card">
                <h3>Набор "Новичок"</h3>
                <p>5,000 монет</p>
                <button class="action-btn" onclick="buyPackage(50, 5000)">50 ⭐️</button>
            </div>

            <div class="card">
                <h3>Набор "Лудоман"</h3>
                <p>20,000 монет</p>
                <button class="action-btn" onclick="buyPackage(150, 20000)">150 ⭐️</button>
            </div>

            <div class="card">
                <h3>VIP Билеты</h3>
                <p>5 золотых билетов</p>
                <button class="action-btn" onclick="buyPackage(100, '5 VIP')">100 ⭐️</button>
            </div>
        </div>

        <div class="page" id="mainPage">
            <div class="header">
                <div class="balance-item">
                    <span class="balance-label">МОНЕТЫ</span>
                    <span class="balance-value" id="balanceText">1,000</span>
                </div>
                <div class="balance-item">
                    <span class="balance-label">БИЛЕТЫ</span>
                    <span class="balance-value" id="ticketsText">5</span>
                </div>
            </div>

            <div class="slot-machine">
                <div class="reels">
                    <div class="reel" id="reel1">🎰</div>
                    <div class="reel" id="reel2">🎰</div>
                    <div class="reel" id="reel3">🎰</div>
                </div>

                <div class="controls">
                    <div class="bet-control">
                        <button class="bet-btn" id="decreaseBet">−</button>
                        <div style="text-align: center;">
                            <div style="font-size: 12px; opacity: 0.6;">СТАВКА</div>
                            <div id="currentBetText" style="font-size: 20px; font-weight: bold;">10</div>
                        </div>
                        <button class="bet-btn" id="increaseBet">+</button>
                    </div>

                    <button class="spin-btn" id="spinBtn">КРУТИТЬ</button>
                    <button id="maxBetBtn" style="background:none; border:none; color:#4cc9f0; font-size:12px; margin-top:5px;">МАКС. СТАВКА</button>
                </div>
            </div>
            
            <p id="message" style="margin-top: 20px; font-weight: bold; height: 24px; color: #4cc9f0;"></p>
        </div>

        <div class="page" id="tasksPage">
            <h2 style="margin-bottom: 20px;">Задания</h2>
            
            <div class="card">
                <h3>Бесплатные монеты</h3>
                <p>Смотри рекламу и получай +500 💰</p>
                <button class="action-btn" id="adBtn">Смотреть рекламу</button>
            </div>

            <div class="card">
                <h3>Рефералы</h3>
                <p>Зови друзей и получай +1000 💰</p>
                <button class="action-btn" id="refBtn">Пригласить друга</button>
            </div>

            <h3 style="margin: 20px 0 10px 0;">Топ игроков</h3>
            <div class="card" id="leaderboardList" style="padding: 10px;">
                Загрузка...
            </div>
        </div>

    </div>

    <div class="dots-container" id="dotsContainer"></div>

    <div id="adminPanel" style="display:none; position:fixed; top:10px; left:10px; background:red; padding:5px; border-radius:5px; z-index:1000; font-size:10px;">
        ADMIN MODE
    </div>
<script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Данные пользователя из Telegram
        const user = tg.initDataUnsafe.user || {};
        const userId = user.id || 0;
        const userName = user.first_name || "Игрок";
        const userUsername = user.username || "player";
        const ADMIN_ID = 1065392792;

        // Состояние игры
        let balance = 1000;
        let tickets = 5;
        let currentBet = 10;
        let isSpinning = false;
        let currentPage = 1;

        // Элементы интерфейса
        const balanceText = document.getElementById('balanceText');
        const ticketsText = document.getElementById('ticketsText');
        const currentBetText = document.getElementById('currentBetText');
        const message = document.getElementById('message');
        const spinBtn = document.getElementById('spinBtn');
        const pagesWrapper = document.getElementById('pagesWrapper');
        const dotsContainer = document.getElementById('dotsContainer');

        const symbols = ['🍒', '🍋', '🔔', '💎', '7️⃣', '🍀'];

        // --- ИНИЦИАЛИЗАЦИЯ РЕКЛАМЫ ADSGRAM ---
        const AdController = window.Adsgram.init({ blockId: "int-25683" }); // Замени на свой ID

        async function showAd() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            try {
                const result = await AdController.show();
                if (result.done) {
                    balance += 500;
                    updateUI();
                    tg.showAlert("🎁 Награда: +500 монет!");
                }
            } catch (e) {
                tg.showAlert("Реклама пока не готова. Попробуйте позже.");
            }
        }

        // --- РЕФЕРАЛЬНАЯ СИСТЕМА ---
        function showReferralLink() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            const botUsername = "YourSlotGameBot"; // ЗАМЕНИТЕ НА ИМЯ ВАШЕГО БОТА
            const shareUrl = `https://t.me/${botUsername}?start=ref${userId}`;
            const fullUrl = `https://t.me/share/url?url=${encodeURIComponent(shareUrl)}&text=Играй со мной в Слот и получай бонусы!`;
            tg.openTelegramLink(fullUrl);
        }

        // --- ЛОГИКА СЛОТОВ ---
        function updateUI() {
            balanceText.textContent = balance.toLocaleString();
            ticketsText.textContent = tickets;
            currentBetText.textContent = currentBet;
            
            // Проверка доступности кнопок
            spinBtn.disabled = isSpinning || balance < currentBet;
        }

        function spin() {
            if (isSpinning || balance < currentBet) return;

            isSpinning = true;
            balance -= currentBet;
            updateUI();
            message.textContent = "Удача близко...";
            
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

            const reels = [
                document.getElementById('reel1'),
                document.getElementById('reel2'),
                document.getElementById('reel3')
            ];

            // Анимация вращения
            const spinInterval = setInterval(() => {
                reels.forEach(reel => {
                    reel.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                });
            }, 100);

            setTimeout(() => {
                clearInterval(spinInterval);
                
                // Результат
                const results = [
                    symbols[Math.floor(Math.random() * symbols.length)],
                    symbols[Math.floor(Math.random() * symbols.length)],
                    symbols[Math.floor(Math.random() * symbols.length)]
                ];

                reels.forEach((reel, i) => reel.textContent = results[i]);

                checkWin(results);
                isSpinning = false;
                updateUI();
            }, 2000);
        }

        function checkWin(results) {
            const [r1, r2, r3] = results;
            let winAmount = 0;

            if (r1 === r2 && r2 === r3) {
                winAmount = currentBet * 10;
                message.textContent = `ДЖЕКПОТ! +${winAmount} 💰`;
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else if (r1 === r2 || r2 === r3 || r1 === r3) {
                winAmount = Math.floor(currentBet * 1.5);
                message.textContent = `Победа! +${winAmount} 💰`;
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            } else {
                message.textContent = "";
            }

            balance += winAmount;
        }
// --- ЛОГИКА НАВИГАЦИИ (СВАЙПЫ) ---
        function updateDots() {
            dotsContainer.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const dot = document.createElement('div');
                dot.classList.add('dot');
                if (i === currentPage) dot.classList.add('active');
                dotsContainer.appendChild(dot);
            }
        }

        // Отслеживаем прокрутку для обновления точек
        pagesWrapper.addEventListener('scroll', () => {
            const width = pagesWrapper.clientWidth;
            const newPage = Math.round(pagesWrapper.scrollLeft / width);
            if (newPage !== currentPage) {
                currentPage = newPage;
                updateDots();
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            }
        });

        // --- ОБРАБОТЧИКИ КНОПОК ---
        
        // Ставки
        document.getElementById('increaseBet').addEventListener('click', () => {
            if (currentBet < 100 && (currentBet + 10) <= balance && !isSpinning) {
                currentBet += 10;
                updateUI();
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            }
        });

        document.getElementById('decreaseBet').addEventListener('click', () => {
            if (currentBet > 10 && !isSpinning) {
                currentBet -= 10;
                updateUI();
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            }
        });

        document.getElementById('maxBetBtn').addEventListener('click', () => {
            if (!isSpinning) {
                currentBet = Math.min(100, Math.floor(balance / 10) * 10);
                if (currentBet < 10) currentBet = 10;
                updateUI();
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            }
        });

        // Кнопка SPIN
        spinBtn.addEventListener('click', spin);

        // Кнопки заданий (Реклама и Рефералы)
        document.getElementById('adBtn').addEventListener('click', showAd);
        document.getElementById('refBtn').addEventListener('click', showReferralLink);

        // --- СЕРВЕРНЫЕ ЗАГЛУШКИ (Чтобы не было ошибок) ---
        async function loadUserData() { console.log("Данные загружены"); updateUI(); }
        async function loadLeaderboards() {
            const list = document.getElementById('leaderboardList');
            if (list) {
                list.innerHTML = `
                    <div class="leader-item"><span>1. ${userName}</span><span>${balance} 💰</span></div>
                    <div class="leader-item"><span>2. CryptoKing</span><span>50,000 💰</span></div>
                    <div class="leader-item"><span>3. SlotMaster</span><span>25,000 💰</span></div>
                `;
            }
        }
        async function updateUserOnServer() { console.log("Синхронизация с сервером..."); }
        async function loadTournaments() { console.log("Турниры активны"); }

        // --- ЗАПУСК ПРИ ЗАГРУЗКЕ ---
        window.onload = () => {
            // Установка начальной страницы (Центральная - Слот)
            setTimeout(() => {
                pagesWrapper.scrollTo({
                    left: pagesWrapper.clientWidth,
                    behavior: 'auto'
                });
                currentPage = 1;
                updateDots();
            }, 100);

            // Проверка админа
            if (userId === ADMIN_ID) {
                document.getElementById('adminPanel').style.display = 'block';
            }

            // Загрузка данных
            loadUserData();
            loadLeaderboards();
            updateUserOnServer();
        };
    </script>
</body>
</html>
